name: Release FastGrep

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package DMG
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build App & Package DMG
        run: |
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastGrep-DMG
          path: |
            dist/FastGrep.dmg
            dist/FastGrep.dmg.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FastGrep ${{ github.ref_name }}
          files: |
            dist/FastGrep.dmg
            dist/FastGrep.dmg.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### ⚡️ FastGrep ${{ github.ref_name }} 发布说明
            
            感谢使用 FastGrep 快摘！
            
            #### 📦 安装说明
            1. 下载下方的 `FastGrep.dmg`。
            2. 双击打开并将 **FastGrep.app** 拖入 **Applications**（应用程序）文件夹。
            3. 若首次打开遇到 macOS 提示“来自未知的开发者”或“已损坏”，请打开终端执行：
               ```bash
               xattr -cr /Applications/FastGrep.app
               ```
            
            ---
            *完整变更记录请参考下方自动生成的 Release Notes。*
